[package]
edition      = "2024"
name         = "rrc-firmware"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "rrc-firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["defmt", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt"] }

embassy-net = { version = "0.9.1", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.11.0", features = ["defmt"] }
esp-println = { version = "0.18.0", features = ["defmt-espflash"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "defmt",
  "esp-alloc",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
leasehund = "0.8.0"
esp-hal-servo = { version = "0.4.0", default-features = false }
embassy-sync = "0.8.0"

[features]
default = ["esp32c3"]

# Chip selection. Enable exactly one of these features.
esp32 = [
  "esp-hal/esp32",
  "esp-hal-servo/esp32",
  "esp-rtos/esp32",
  "esp-radio/esp32",
  "esp-alloc/esp32",
  "esp-println/esp32",
  "esp-bootloader-esp-idf/esp32",
]
esp32c2 = [
  "esp-hal/esp32c2",
  "esp-hal-servo/esp32c2",
  "esp-rtos/esp32c2",
  "esp-radio/esp32c2",
  "esp-alloc/esp32c2",
  "esp-println/esp32c2",
  "esp-bootloader-esp-idf/esp32c2",
]
esp32c3 = [
  "esp-hal/esp32c3",
  "esp-hal-servo/esp32c3",
  "esp-rtos/esp32c3",
  "esp-radio/esp32c3",
  "esp-alloc/esp32c3",
  "esp-println/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
]
esp32c6 = [
  "esp-hal/esp32c6",
  "esp-hal-servo/esp32c6",
  "esp-rtos/esp32c6",
  "esp-radio/esp32c6",
  "esp-alloc/esp32c6",
  "esp-println/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
]
esp32s2 = [
  "esp-hal/esp32s2",
  "esp-hal-servo/esp32s2",
  "esp-rtos/esp32s2",
  "esp-radio/esp32s2",
  "esp-alloc/esp32s2",
  "esp-println/esp32s2",
  "esp-bootloader-esp-idf/esp32s2",
]
esp32s3 = [
  "esp-hal/esp32s3",
  "esp-hal-servo/esp32s3",
  "esp-rtos/esp32s3",
  "esp-radio/esp32s3",
  "esp-alloc/esp32s3",
  "esp-println/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
]
# SuperMini boards have a notoriously poor antenna layout, so the firmware
# lowers the maximum TX power for them to avoid unstable Wi-Fi. Enable this
# together with the chip feature, e.g. `--features esp32c3,supermini`.
supermini = []

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
